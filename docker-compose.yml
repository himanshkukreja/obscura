name: obscura

# `cp .env.example .env && docker compose up` should be the whole setup.
# No AWS account, no R2 account, no CDN.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: [.env]
  environment:
    DATABASE_URL: postgres://obscura:obscura@postgres:5432/obscura
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    # Signed URLs are handed to a browser, which cannot resolve `minio`.
    S3_PUBLIC_ENDPOINT: http://localhost:9000
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obscura
      POSTGRES_PASSWORD: obscura
      POSTGRES_DB: obscura
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obscura"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: obscura
      MINIO_ROOT_PASSWORD: obscura123
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Creates both buckets and asserts they are PRIVATE. A public bucket would defeat the
  # entire project, so this runs on every start rather than being a setup note.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 obscura obscura123 &&
      mc mb --ignore-existing local/obscura-source &&
      mc mb --ignore-existing local/obscura-delivery &&
      mc anonymous set none local/obscura-source &&
      mc anonymous set none local/obscura-delivery &&
      echo 'buckets ready and private'
      "

  api:
    <<: *app
    command: ["node", "apps/api/dist/index.js"]
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  edge:
    <<: *app
    command: ["node", "apps/edge/dist/index.js"]
    environment:
      DATABASE_URL: postgres://obscura:obscura@postgres:5432/obscura
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      API_RUN_MIGRATIONS: "false"
    ports: ["3002:3002"]

  # The only expensive component. Scale independently: docker compose up --scale worker=4
  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://obscura:obscura@postgres:5432/obscura
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      WORKER_RUN_MIGRATIONS: "false"

  player:
    build:
      context: .
      dockerfile: docker/Dockerfile.player
    ports: ["3000:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
